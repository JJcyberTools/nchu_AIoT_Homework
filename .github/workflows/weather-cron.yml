name: Collect weather every 30 minutes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel weather API
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --max-time 60 \
            "https://nchu-a-io-t-homework.vercel.app/api/weather"
